# A股趋势选股策略参数配置

# 策略基本设置
strategy:
  name: "TrendSelection"

# 趋势判断参数
trend:
  ma_periods: [5, 10, 20, 60]    # 均线周期
  breakout_days: 20              # 突破天数(价格突破N日高点)

# 交易参数
trading:
  max_positions: 5               # 最大持仓数量
  entry_ma_period: 5             # 进场参考均线周期
  entry_check_time: 1000         # 开始检查进场时间(10:00)
  stop_entry_time: 1430          # 停止进场时间(14:30)

# 止损参数
stop_loss:
  price_below_days: 3            # 价格低于买入价持续天数
  shadow_trigger_time: 1430      # 尾盘检测时间(14:30)
  shadow_ratio: 2.0              # 上影线/实体比例阈值
  big_yin_ratio: 3.0             # 大阴线跌幅阈值(%)

# 资金管理
capital:
  total_capital: 1000000         # 总资金
  position_ratio: 0.2            # 单只股票仓位比例